<script>

const API_BASE = "https://scotap-otp-api.onaolapor39.workers.dev";

document.getElementById("year").textContent =

  new Date().getFullYear();

// CONNECT WALLET TO CLOUDFLARE WORKER

async function refreshBalance() {

  const balanceEl = document.getElementById("balance");

  const noteEl = document.getElementById("balance-note");

  const msgEl = document.getElementById("balance-msg");

  const button = document.getElementById("refresh-balance");

  button.disabled = true;

  button.textContent = "Loading...";

  msgEl.textContent = "";

  noteEl.textContent = "Connecting to OTP Suite...";

  try {

    const response = await fetch(

      API_BASE + "/api/balance",

      {

        method: "GET",

        headers: {

          "Accept": "application/json"

        },

        cache: "no-store"

      }

    );

    const result = await response.json();

    if (!response.ok || result.success !== true) {

      throw new Error(

        result.error || "Could not retrieve wallet balance."

      );

    }

    const data = result.data || result;

    if (typeof data.balance !== "number" ||

        !Number.isFinite(data.balance)) {

      throw new Error("The server returned an invalid balance.");

    }

    balanceEl.textContent = new Intl.NumberFormat(

      "en-NG",

      {

        style: "currency",

        currency: data.currency || "NGN",

        minimumFractionDigits: 2,

        maximumFractionDigits: 2

      }

    ).format(data.balance);

    noteEl.textContent = "Live balance received from OTP Suite.";

    msgEl.textContent = "Balance updated successfully.";

  } catch (error) {

    noteEl.textContent = "Wallet balance could not be loaded.";

    msgEl.textContent =

      "Connection error: " + error.message;

  } finally {

    button.disabled = false;

    button.textContent = "Refresh balance";

  }

}

document.getElementById("refresh-balance")

  .addEventListener("click", refreshBalance);

// CHECK SERVICE SELECTION

document.getElementById("prepare-order")

  .addEventListener("click", () => {

    const country =

      document.getElementById("country").value;

    const service =

      document.getElementById("service").value;

    document.getElementById("order-msg").textContent =

      (!country || !service)

        ? "Choose both a country and a service first."

        : "You selected " + service + " in " + country +

          ". Live availability and ordering still need to be connected.";

  });

// ACCOUNT PREVIEW

document.getElementById("signin")

  .addEventListener("click", () => {

    document.getElementById("account-msg").textContent =

      "Sign-in is not connected yet.";

  });

document.getElementById("profile")

  .addEventListener("click", () => {

    document.getElementById("account-msg").textContent =

      "Profile settings are not connected yet.";

  });

// LOAD THE REAL BALANCE WHEN THE PAGE OPENS

refreshBalance();

</script>
</body>
</html>
